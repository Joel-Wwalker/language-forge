[project]
name = "slot_lgc_006"
version = "0.1.0"
description = "slot_lgc_006, a logic_like programming language with dynamic typing and host_gc memory. Generated by Language Forge."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "lark>=1.1.9",
]
authors = [
    {name = "Generated by Language Forge"},
]
keywords = ["programming-language", "compiler", "transpiler", "logic_like", "dynamic"]

[project.scripts]
slot_lgc_006 = "slot_lgc_006.compile:main"

[project.urls]
Source = "https://example.com/slot_lgc_006"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The package files live at the project root (this directory IS the package),
# so we point setuptools at "." for the package "slot_lgc_006".
packages = ["slot_lgc_006"]
package-dir = {"slot_lgc_006" = "."}
include-package-data = true

[tool.setuptools.package-data]
"slot_lgc_006" = ["examples/*", "tests/*"]
