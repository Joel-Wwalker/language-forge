# LinkedIn Connect — your config. Edit before running.
#
# Pre-flight: install dependencies first.
#   pip install -r requirements.txt
#   playwright install chromium

[search]
# LinkedIn search query. Keep it tight: too broad and you'll connect with
# the wrong people, which signals to LinkedIn that you're spamming.
keywords = "software engineer recruiter"

# Location filter. LinkedIn's "geoUrn" IDs for NJ/NY metro areas:
#   New York City Metropolitan Area:   103644278
#   New Jersey:                         101165590
#   Newark, NJ Metropolitan Area:       104267203
# Pass one or more, comma-separated.
geo_urns = ["103644278", "101165590"]

# Connection-degree filter. "F" = first-degree (already connected — skip),
# "S" = second-degree, "O" = out-of-network (third+).
# Default ["S", "O"] (people you don't already know).
network_distance = ["S", "O"]

# Title keywords to require — extra filter on top of LinkedIn's full-text
# search. Each candidate's headline / current title is checked. If none
# of these appear, skip them. Lowercase substring match.
require_title_terms = ["recruit", "talent", "sourcer"]

# Title keywords to exclude. Skip candidates whose title contains any of
# these (e.g. "executive recruiter" if you're entry-level; or "manager"
# if you only want hands-on recruiters).
exclude_title_terms = ["executive search"]

# Number of result pages to walk per run. LinkedIn shows ~10/page.
# Stay conservative: more pages = more profile views = more visibility
# to LinkedIn's anti-automation heuristics.
max_pages = 3


[message]
# Send connection requests with NO note attached. Default true.
# Recruiters often accept these at a higher rate than noted ones —
# notes from strangers read as solicitation, no-note reads as a
# casual "let's connect." Plus it's faster: one fewer modal step.
skip_note = true

# If you flip skip_note=false, this template is used. Placeholders:
#   {first_name}  — recruiter's first name from LinkedIn
#   {company}     — current company (best-effort; can be blank)
# Hard cap: 300 chars (LinkedIn's note length limit).
template = """Hi {first_name}, I'm a software engineer in the NJ/NY area looking for new opportunities. Saw you recruit in the space and wanted to connect. Thanks!"""


[limits]
# Daily cap on connection requests sent. LinkedIn's hard weekly cap is
# ~100; sub-100/week is safer. 10/day = 70/week with headroom.
daily_max = 10

# Total cap on candidates surfaced per run (semi-auto mode). If you only
# want to review 20 profiles, set this to 20.
per_run_max = 20

# Inter-action delay, seconds (min, max). Randomized per action.
# Don't set below 30s — that's the threshold below which LinkedIn's
# heuristics start flagging you.
delay_seconds = [30, 90]


[runtime]
# Where to store the SQLite log of who you've contacted, plus the
# Playwright session state (cookies). Both are gitignored.
state_dir = ".state"

# Mode:
#   "semi"  — opens each candidate in a tab; YOU click Connect. Safe.
#   "auto"  — clicks Connect for you. Higher risk; account may be
#              restricted within days. Requires explicit acknowledgment
#              via --i-understand-the-risks on the CLI.
mode = "semi"

# Log every action to a file in addition to stdout. Useful for noticing
# patterns (which profiles can't be connected to, which have the
# "Pending" badge meaning you already invited them, etc.).
log_file = ".state/run.log"
