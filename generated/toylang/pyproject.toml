[project]
name = "toylang"
version = "0.1.0"
description = "toylang — a c_like programming language with dynamic typing and host_gc memory. Generated by Language Forge."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "lark>=1.1.9",
]
authors = [
    {name = "Generated by Language Forge"},
]
keywords = ["programming-language", "compiler", "transpiler", "c_like", "dynamic"]

[project.scripts]
toylang = "toylang.compile:main"

[project.urls]
Source = "https://example.com/toylang"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The package files live at the project root (this directory IS the package),
# so we point setuptools at "." for the package "toylang".
packages = ["toylang"]
package-dir = {"toylang" = "."}
include-package-data = true

[tool.setuptools.package-data]
"toylang" = ["examples/*", "tests/*"]
