[project]
name = "stacky"
version = "0.1.0"
description = "stacky, a stack_based programming language with static typing and host_gc memory. Generated by Language Forge."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "lark>=1.1.9",
]
authors = [
    {name = "Generated by Language Forge"},
]
keywords = ["programming-language", "compiler", "transpiler", "stack_based", "static"]

[project.scripts]
stacky = "stacky.compile:main"

[project.urls]
Source = "https://example.com/stacky"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The package files live at the project root (this directory IS the package),
# so we point setuptools at "." for the package "stacky".
packages = ["stacky"]
package-dir = {"stacky" = "."}
include-package-data = true

[tool.setuptools.package-data]
"stacky" = ["examples/*", "tests/*"]
