[project]
name = "forthlang"
version = "0.1.0"
description = "forthlang. A Forth-flavored stack_based / concatenative dialect (dynamic / host_gc). The hand-written reference for stack_based languages generated by Language Forge."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []
authors = [
    {name = "Generated by Language Forge"},
]
keywords = ["programming-language", "compiler", "transpiler", "forth", "stack_based", "concatenative"]

[project.scripts]
forthlang = "forthlang.compile:main"

[project.urls]
Source = "https://example.com/forthlang"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["forthlang"]
package-dir = {"forthlang" = "."}
include-package-data = true

[tool.setuptools.package-data]
"forthlang" = ["examples/*", "tests/*"]
