[project]
name = "lisplang"
version = "0.1.0"
description = "lisplang. A Clojure-flavored Lisp dialect (s_expression / dynamic / host_gc). The hand-written reference for s_expression languages generated by Language Forge."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "lark>=1.1.9",
]
authors = [
    {name = "Generated by Language Forge"},
]
keywords = ["programming-language", "compiler", "transpiler", "lisp", "s_expression"]

[project.scripts]
lisplang = "lisplang.compile:main"

[project.urls]
Source = "https://example.com/lisplang"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lisplang"]
package-dir = {"lisplang" = "."}
include-package-data = true

[tool.setuptools.package-data]
"lisplang" = ["examples/*", "tests/*"]
