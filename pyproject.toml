[project]
name = "forge"
version = "0.1.0"
description = "Language Forge — generate working programming languages from option selections"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "lark>=1.1.9",
    "jsonschema>=4.21.0",
    "jinja2>=3.1.3",
    "flask>=3.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forge*"]
exclude = ["generated*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
